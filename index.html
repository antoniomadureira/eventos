<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventos PGU</title><style>body{margin:0;font-family:Segoe UI,Arial;background:#f4f7f9;color:#17212b}header{padding:32px;background:linear-gradient(120deg,#005b96,#00a7b5);color:#fff}.wrap{max-width:1100px;margin:auto;padding:20px}input,button{padding:12px;border-radius:9px;border:1px solid #dbe4ea;font-size:15px}input{width:70%}button{background:#005b96;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:20px}.card{background:#fff;border:1px solid #dbe4ea;border-radius:14px;padding:18px}.card h2{color:#005b96;font-size:19px}.muted{color:#637381}pre{white-space:pre-wrap}</style></head><body><header><div class="wrap"><h1>Eventos PGU</h1><p>Município de Matosinhos</p></div></header><main class="wrap"><input id="q" placeholder="Pesquisar eventos..."><button onclick="load()">Atualizar</button><p id="status" class="muted">A carregar...</p><section id="grid" class="grid"></section></main><script>const API='https://www.cm-matosinhos.pt/api/v1/pgu_events.json';let data=[];const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const val=(o,a)=>a.map(k=>o[k]).find(v=>v!=null&&v!=='')||'';function render(){let q=document.querySelector('#q').value.toLowerCase();let rows=data.filter(x=>JSON.stringify(x).toLowerCase().includes(q));status.textContent=rows.length+' evento(s)';grid.innerHTML=rows.map(e=>`<article class="card"><h2>${esc(val(e,['title','titulo','name','nome'])||'Evento')}</h2><p>${esc(val(e,['date','data','start','start_date','data_inicio']))}</p><p>${esc(val(e,['location','local','place','morada']))}</p><div class="muted">${esc(val(e,['description','descricao','details','content']))}</div></article>`).join('')||'<p>Nenhum evento encontrado.</p>'}async function load(){status.textContent='A carregar...';try{let r=await fetch(API);if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();data=Array.isArray(j)?j:(j.events||j.data||Object.values(j));render()}catch(e){status.textContent='Erro ao carregar a API: '+e.message;grid.innerHTML='<p>O servidor poderá bloquear pedidos locais por CORS. Publique esta página num servidor web.</p>'}}document.querySelector('#q').addEventListener('input',render);load();</script></body></html>
